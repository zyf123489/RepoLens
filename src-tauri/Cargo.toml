[package]
name = "repolens"
version = "0.1.0-alpha.1"
description = "Local Git repository and configuration identity workbench"
edition = "2021"
rust-version = "1.99"

[lib]
name = "repolens_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "repolens"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
url = "2"
glob = "0.3"
same-file = "1"
tempfile = "3"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
